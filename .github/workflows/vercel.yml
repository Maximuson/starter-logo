# Vercel production deploy via GitHub Actions (prebuilt).
#
# Local dev uses Docker Compose (app + Postgres). Vercel runs Next.js SSR
# directly on Node 24 with a remote DATABASE_URL — no Docker on Vercel.
#
# `vercel build` runs on the GitHub Actions runner (not on Vercel), so
# DATABASE_URL must be passed explicitly for prisma migrate deploy during build.
#
# Required GitHub secrets:
#   VERCEL_TOKEN, VERCEL_ORG_ID, VERCEL_PROJECT_ID, DATABASE_URL
#
# Also set DATABASE_URL in Vercel Production env vars for runtime SSR.

name: Vercel Production

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: vercel-production
  cancel-in-progress: true

env:
  VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
  VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
  DATABASE_URL: ${{ secrets.DATABASE_URL }}

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Verify DATABASE_URL secret
        run: |
          if [ -z "$DATABASE_URL" ]; then
            echo "::error::DATABASE_URL is missing. Add it as a repository secret (Settings → Secrets and variables → Actions). Use your Vercel Postgres connection string — not the Docker Compose db hostname."
            exit 1
          fi
          echo "DATABASE_URL is configured"

      - name: Install dependencies
        run: npm ci

      - name: Install Vercel CLI
        run: npm install --global vercel@50

      - name: Pull Vercel environment
        run: vercel pull --yes --environment=production --token=${{ secrets.VERCEL_TOKEN }}

      - name: Build for production
        run: vercel build --prod --token=${{ secrets.VERCEL_TOKEN }}

      - name: Deploy to Vercel
        id: deploy
        run: echo "url=$(vercel deploy --prebuilt --prod --token=${{ secrets.VERCEL_TOKEN }})" >> $GITHUB_OUTPUT

      - name: Deployment URL
        run: echo "Production deployment ${{ steps.deploy.outputs.url }}"
